# Installateur Windows (phase 10, D82 à D85). `npm run dist` produit dist/Boutique-Gestion-Setup-<version>.exe.
# Signature : définir CSC_LINK (certificat .pfx ou chemin) et CSC_KEY_PASSWORD avant `npm run dist:signed`
# (D84) ; sans certificat, `npm run dist` produit un installateur non signé.
appId: ci.boutique.gestion
productName: Boutique Gestion
copyright: Copyright © 2026 Armand
directories:
  output: dist
  buildResources: build
# Modules natifs N-API précompilés (better-sqlite3-multiple-ciphers, @node-rs/argon2) : valables pour
# Electron sans recompilation.
npmRebuild: false
asar: true
asarUnpack:
  - '**/*.node'
files:
  - package.json
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - '!**/*.map'
  - '!node_modules/better-sqlite3-multiple-ciphers/{deps,src,binding.gyp}/**'
  - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux,linuxmusl,win32-arm64}*'
electronLanguages:
  - fr
  - en-US
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  executableName: BoutiqueGestion
  requestedExecutionLevel: asInvoker
  legalTrademarks: Boutique Gestion
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Boutique Gestion
  uninstallDisplayName: Boutique Gestion
  # Les données (base chiffrée, clés, sauvegardes) vivent dans %APPDATA%\Boutique Gestion : jamais
  # effacées à la désinstallation (D83).
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages:
    - fr_FR
  language: '1036'
  artifactName: Boutique-Gestion-Setup-${version}.${ext}
  differentialPackage: false
publish: null
