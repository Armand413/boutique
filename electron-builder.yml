# Installateur Windows (phase 10, D82 à D85). `npm run dist` produit dist/Bouba-Store-Setup-<version>.exe.
# Signature : définir CSC_LINK (certificat .pfx ou chemin) et CSC_KEY_PASSWORD avant `npm run dist:signed`
# (D84, D97) ; le certificat doit être délivré au nom de 2KConception. Sans certificat, `npm run dist`
# produit un installateur non signé.
appId: ci.boutique.gestion
productName: Bouba Store
copyright: Copyright © 2026 2KConception. Tous droits réservés.
directories:
  output: dist
  buildResources: build
# Modules natifs N-API précompilés (better-sqlite3-multiple-ciphers, @node-rs/argon2) : valables pour
# Electron sans recompilation.
npmRebuild: false
asar: true
asarUnpack:
  - '**/*.node'
files:
  - package.json
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - '!**/*.map'
  - '!node_modules/better-sqlite3-multiple-ciphers/{deps,src,binding.gyp}/**'
  - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux,linuxmusl,win32-arm64}*'
electronLanguages:
  - fr
  - en-US
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  executableName: BoubaStore
  requestedExecutionLevel: asInvoker
  legalTrademarks: Bouba Store — 2KConception
  # Une fois le certificat de 2KConception obtenu (D97), ajouter `publisherName: 2KConception` : la mise à
  # jour vérifiera alors que chaque setup est bien signé par 2KConception.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Bouba Store
  uninstallDisplayName: Bouba Store
  # Les données (base chiffrée, clés, sauvegardes) vivent dans %APPDATA%\Bouba Store : jamais
  # effacées à la désinstallation (D83).
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages:
    - fr_FR
  language: '1036'
  artifactName: Bouba-Store-Setup-${version}.${ext}
  differentialPackage: false
publish: null
